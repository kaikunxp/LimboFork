plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.limbo.emu.main'
    compileSdk 35

    defaultConfig {
        applicationId "com.limbo.emu.main"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "6.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions += "arch"
    productFlavors {
        universal {
            dimension "arch"
            applicationIdSuffix ""
            versionNameSuffix "-universal"
        }
        x86 {
            dimension "arch"
            applicationIdSuffix ".x86"
            versionNameSuffix "-x86"
        }
        arm {
            dimension "arch"
            applicationIdSuffix ".arm"
            versionNameSuffix "-arm"
        }
        powerpc {
            dimension "arch"
            applicationIdSuffix ".ppc"
            versionNameSuffix "-ppc"
        }
        sparc {
            dimension "arch"
            applicationIdSuffix ".sparc"
            versionNameSuffix "-sparc"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }

    buildFeatures {
        compose true
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.recyclerview
    implementation libs.androidx.preference
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.viewmodel.compose

    // Compose BOM & UI
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    debugImplementation libs.androidx.compose.ui.tooling

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
